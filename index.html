  <title>CCTV Web Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <div id="header">
      <h1>CCTV Web Viewer</h1>
      <div id="controls">
        <input type="email" id="emailInput" placeholder="Enter pairing email" value="">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
      </div>
      <div id="status">Enter email &amp; connect to pair</div>
    </div>
    <div id="video-container">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <div id="no-stream">Waiting for broadcast...</div>
    </div>
  </div>
